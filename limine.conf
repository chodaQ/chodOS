# limine.conf — limine 부트로더 설정
# limine v7.x / v8.x 문법
#
# limine은 이 파일을 /boot/limine/limine.conf에서 읽음.
# (ISO를 만들 때 이 경로에 복사해야 함 — Makefile 참고)

# 부트 메뉴 표시 시간 (초)
# 0 = 메뉴 없이 첫 번째 항목으로 즉시 부팅
# 개발 중에는 0이 편리함
timeout: 0

# ==================== 부트 항목 ====================
# /로 시작하는 줄이 부트 항목 이름 (메뉴에 표시됨)

/MuKernel OS (x86_64)

    # 부트로더 프로토콜 선택
    # "limine": limine 네이티브 프로토콜 (가장 많은 기능 제공)
    # "multiboot2": GRUB 호환 프로토콜 (호환성이 필요할 때)
    protocol: limine

    # 커널 ELF 바이너리 경로
    # boot(): = 이 설정 파일이 있는 파티션(부트 파티션)의 루트
    # /boot/kernel = 파티션 내 절대 경로
    kernel_path: boot():/boot/kernel

    # 커널 커맨드라인 인수 (선택사항)
    # 커널은 limine 요청으로 이 문자열을 받을 수 있음
    # cmdline: loglevel=debug nokaslr
