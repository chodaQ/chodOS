name: 버그 리포트
description: 부팅 실패, 크래시, 잘못된 동작을 신고합니다
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        커널 버그는 재현 환경에 크게 좌우됩니다. 특히 **QEMU 버전**을 꼭
        적어주세요 — 11.0.0에서만 재현되던 `#GP` 사례가 있었습니다.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요
      placeholder: 부팅 중 ... 단계에서 멈춤 / 패닉 메시지 ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1. make all
        2. make run
        3. ST-3 구간에서 크래시
    validations:
      required: true

  - type: input
    id: qemu
    attributes:
      label: QEMU 버전
      placeholder: "qemu-system-x86_64 --version 출력 (예: 11.0.3)"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: 호스트 환경
      placeholder: "예: Apple M4 Pro / macOS 15, Ubuntu 24.04 x86_64"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 시리얼 로그
      description: 크래시 직전 부분을 붙여주세요. 길면 파일로 첨부해도 됩니다.
      render: text
